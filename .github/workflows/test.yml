name: Test

on:
  push:
    branches: [master, develop]
  # Unfiltered so stacked PRs, which target another PR's branch, also run CI
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm store on a Dev Drive makes Windows installs faster
      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          env-mapping: |
            PNPM_CONFIG_STORE_DIR,{{ DEV_DRIVE }}/.pnpm-store

      - name: Setup Node.js, pnpm, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Type check
        if: runner.os == 'Linux'
        run: pnpm type-check

      - name: Test
        run: pnpm test

  # The main job tests the newest peers and the pinned Node.js. This job
  # tests the oldest supported versions that package.json declares.
  compatibility:
    name: Compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rollup 3
            install: rollup@3
          - name: Vite 5
            install: vite@5
          - name: Vite 6
            install: vite@6

          # The suite runs on the pinned Node.js, which can run TypeScript,
          # and runs the built package with Node.js 20
          - name: Node.js 20
            node: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Install ${{ matrix.install }}
        if: matrix.install
        run: pnpm add --save-dev ${{ matrix.install }}

      - name: Download Node.js ${{ matrix.node }}
        if: matrix.node
        run: echo "PACKAGE_TEST_NODE=$(pnpm dlx node@${{ matrix.node }} -p process.execPath | tail -1)" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test
